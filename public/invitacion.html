<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Acceso · Despachos Silogtran</title><link rel="stylesheet" href="/styles.css"></head>
<body><main>
<h1>Bienvenido</h1>
<p class="muted">Ingresa con tu usuario y contraseña de Silogtran para activar tu cuenta. Tu contraseña se guarda cifrada y solo se usa para despachar en tu nombre.</p>
<form id="f" class="card" autocomplete="off">
  <label for="u">Usuario de Silogtran</label>
  <input id="u" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required maxlength="100">
  <label for="p">Contraseña de Silogtran</label>
  <input id="p" type="password" autocomplete="off" required maxlength="100">
  <div class="row"><button id="go" class="btn primary" type="submit">Ingresar</button></div>
  <div id="msg" class="msg hidden" role="status"></div>
</form>
<footer>Este link es de un solo uso y vence a las 2 horas. <a href="/manual">Ver manual</a></footer>
</main><script src="/app.js"></script><script src="/invitacion.js"></script></body></html>
